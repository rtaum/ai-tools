              - generic [ref=f18e2197]: Odradzam.- Instruktor podczas jazd na A2 gwiżdże w słuchawkę, śpiewa, często podnosi głos. Notorycznie rozmawia z kimś przez telefon, czy to z rodziną, czy następnym kursantem, czy nawet mechanikiem.- Notorycznie się spóźnia, po czym kończy wcześniej jazdy, co nie jest odnotowywane w karcie kursanta.- Załatwia swoje sprawy w czasie jazd - raz zdarzyła się sytuacja, gdzie przez 20 minut czekałam na niego pod sklepem bo poszedł sobie kupić picie lub innym razem czekałam 15 minut ponieważ musiał zatankować auto i zamówić kawę na stacji, już pomijając inne podobnego typu sytuacje, gdzie czekałam na niego nieco krócej - dany czas nie został odliczony od wyjeżdżonych godzin, tylko zmarnowany.- Kompletnie nieprofesjonalne podejście do kursanta, częste odwoływanie lub przenoszenie umówionych godzin, zapisywanie że nauka została rozpoczęta o konkretnej godzinie, gdzie rozpoczęła się niemalże 20 minut później przez spóźnienie instruktora.- Z bardziej nieprzyjemnych sytuacji - gdy po raz pierwszy przewrócił mi się motor, instruktor rzucił tylko "niech go Pani teraz podnosi" po czym odszedł bez udzielenia żadnych instrukcji i wrócił dopiero po dłuższym czasie.- Brak szacunku do kursanta, zwracanie się per "lady", poniżanie go, budowanie nieprzyjemnej i stresującej atmosfery.- Strasznie słabe tłumaczenie ze strony instruktora, sprawia wrażenie jakby oczekiwał że kursant powinien już sam wszystko umieć i wiedzieć.- Po odbyciu wszystkich godzin instruktor ani razu nie zaprezentował jak się sprawdza stan techniczny pojazdu oraz nie odbył ze mną manewru przemieszczenia pojazdu z wyłączonym silnikiem. Ani razu również nie zostało mi przedstawione hamowanie awaryjne, już nie mówiąc o praktyce tych czynności.- Na dłuższą metę, można odnieść wrażenie że szkoła jest skora do udzielania złej nauki, by doprowadzić do jazd dodatkowych.Zdecydowanie odradzam wybór tej szkoły, w Krakowie jest dostępnych wiele lepszych szkół, w które o wiele bardziej warto zainwestować swój czas i pieniądze.
