              - generic [ref=f18e3075]: Overall, it's okay. That's all I can say.The theory lessons are very specific; there's an unfriendly environment for asking questions, there's a lot of back-and-forth, you're being harassed for not knowing every detail of the rules you're about to learn, and so on.Driving lessons are an even bigger mess. Cancelling lessons because other students had to pass, regularly causing anxiety behind the wheel, and dealing with personal matters while driving were standard.So, it must be said, there are also positives. After failing the first time, there were phone calls, analysis, and help. And in the end, I passed the exam without any major problems.Generally, you need to carefully consider what you want from the course and how much you're willing to sacrifice.Best regards.
