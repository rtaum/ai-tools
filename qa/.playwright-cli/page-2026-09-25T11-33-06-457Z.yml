            - generic [ref=f18e2649]: 7 years ago
            - generic [ref=f18e2664]:
              - generic [ref=f18e2665]: "TL;DR: Hidden costs, unprofessionalism, and a desire to make as much money as possible off a student \"over the dead.\"I joined the center after transferring from another OSK because of the express course option (or at least that's what the website said, which I'll discuss later). Since I'd previously completed theoretical training, I only completed the practical portion (28 hours) at OSK Relax.- No contract --At the beginning of the course, no contract was presented (despite asking about it), only the regulations. In the event of a dispute, you can forget about pursuing your case, as there's no basis for it other than the very general regulations.- \"Express\" course --The website states 21 days for the express course. I signed up at the beginning of July and made it clear that I wanted to save time, so I finished 28 hours of driving (because that's how much time was left after transferring from another OSK) in October (again, this wouldn't have happened if a contract had been signed). And I paid for an accelerated course, as described below.- Hidden costs, \"Janusz Biznesu 1\" --When I made my final payment, I was told that I wouldn't receive my certificates unless I paid for the 3-month course (without theory!) as if it were an accelerated course (which was supposed to last 33 days :) ) (this ultimately led me to describe everything in detail in my review).- Hidden costs, \"Janusz Biznesu 2\" --Hidden costs - although they are included in the regulations, you need to be prepared for about 100 PLN (I don't remember the exact amount) for the internal theory + practice exam. (This, of course, opens up the possibility of profiting from \"failing\" test-takers; the lack of a contract makes it easier. For example, I heard a requirement to \"buy additional driving lessons\" before the state exam (perhaps because I was pressed for time) :) )-- Impertinent behavior --One of the instructors (I'll keep his name to myself) impertinently argued with the company on the phone during the driving lessons – shouting and stressing, not to mention focusing on the road.-- Lack of a plan --Engine components were shown during one of the last driving lessons.++ Some instructors ++Some instructors put a lot of effort into explaining and conducting the practice in a professional manner. I wish them all the best.++ Exact number of hours ++If the driving lessons were scheduled for 2 hours, that's how long they lasted – although I wasn't cheated on that ;) But I guess that's what you pay for?In summary, I strongly advise against using these companies. I hope there are as few of these companies on the market as possible."
