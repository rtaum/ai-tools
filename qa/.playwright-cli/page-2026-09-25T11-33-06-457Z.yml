            - generic [ref=f18e2288]: 6 years ago
            - generic [ref=f18e2303]:
              - generic [ref=f18e2304]: One star for this institution is still too much... But it's impossible to give less.Let me start by saying that I took my driving test for Category A, having a B, and passed on my first attempt - but that wasn't thanks to Mr. Dariusz, who led the classes.I strongly advise against this school to anyone looking for one - those who already know how to drive and those who want to learn.As others have written, the guy is demanding additional fees at the end of the course (I'm surprised no one has sued him yet... or maybe he did). In my case, he took my medical records and said he wouldn't give them back :) - the case ended with the intervention of the police -...he gave them back.It seems Mr. D. is a ridiculous person who wants to make money off everything and has already developed methods that probably work sometimes.If you're doing Category A, be prepared to ride with a "backpack" in the form of Mr. D - he probably doesn't want to waste his fuel on a separate motorcycle.Pay 100, 200, 300 PLN more and choose another decent facility - you won't regret it.
