              - generic [ref=f18e2221]: Ta opinia będzie dość długa, z racji moich wielu przykrych doświadczeń w tej szkole jazdy. Oczywiście na samym początku muszę napisać, że zdecydowanie nie polecam OSK-Relax. (Pomijam już sam "ośrodek" w kamienicy, która w środku jest bardzo obskurna..) Przechodząc do rzeczy - 3 instruktorów - jeździłam ze wszystkimi, każdy mi mówił co innego. Na samym początku zadając jakiekolwiek pytania dostawałam odpowiedź "a to Pani tego nie wie?" Pomijając - jeden z instruktorów, (z którym jeździłam najczęściej) był bardzo niesympatyczny, wręcz chamski. Obsługę samochodu oraz co się znajduje pod maską pokazano mi praktycznie pod sam koniec jazd, o wiele rzeczy trzeba się upominać. Pan instruktor bardzo często załatwiał swoje sprawy prywatne podczas jazd ze mną, notorycznie rozmawiał przez telefon. Raz umówiłam się na jazdy, miałam wszystko zapisane w kalendarzu, po czym okazało się, że pan instruktor umówił sobie na ten dzień i godzinę inną osobę, wmawiając mi, że musiało mi się coś pomylić, kolejna wręcz komiczna sytuacja - raz przyjechałam pod "ośrodek jazd" czekając z 20 minut, po czym wróciłam do domu i otrzymałam telefon godzinę później z zapytaniem gdzie jestem. Kompletny brak szacunku wobec kursantów... Idąc dalej.. Co innego jest napisane na stronie internetowej, co innego jest w rzeczywistości. Miałam jeździć kia rio, a w większości dostawałam toyote yaris. Za wewnętrzny egzamin teoretyczny trzeba tam płacić, żaden z moich znajomych robiących prawo jazdy z takim czymś się nie spotkał. Jak dla mnie pod każdym względem ta szkoła jazdy okazała się porażką, nie polecam nikomu.
