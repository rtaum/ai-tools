              - generic [ref=f18e4085]:
                - text: Recently, a friend of mine asked me about this school, and I was quite surprised that it has such a high rating. There are plenty of comments here from people who only have one opinion and give it 5 stars :) So, for the benefit of future students, I'll allow myself to describe my feelings about studying at this OSK.Overall, it all comes down to Mr. Dariusz, a seasoned businessman, and his wild "practices." At first, it's pleasant and enjoyable. This begins to change as the course draws to a close. You might find that you're not yet ready for the exam, that it's not quite the right time. Mr. Darek recommends purchasing additional lessons. If you don't purchase additional lessons, 99% of you will fail the internal exam. Mr. Darek has his own ways of doing this.Mr. Dariusz also has other methods in place. Threatening to prevent you from taking the exam, "supposedly" calling MORD, withholding documents. The whole spectrum. You'll surely come across one.As for the teaching itself, I don't have such reservations. It's okay, but the whole hype and money-grabbing thing is a nightmare! On top of that, there's the manipulation, personal matters, and so on.If you don't want to stress yourself out, skip this school. Pay a few hundred extra and you'll have peace and quiet.
