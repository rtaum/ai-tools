              - generic [ref=f18e2191]: Nikomu nie polecam tej szkoły jazdy. Pozytywne opinie mogą być zwyczajnie nakręcane — podczas jazd Dariusz (nie potrafię kulturalnie nazwać go „panem”, bo swoim zachowaniem na to nie zasługuje) ciągle wymusza wystawianie pozytywnych opinii, cały czas o tym mówi i sprawdza, czy kursant faktycznie coś napisał.Dla niego normalne jest również załatwianie prywatnych spraw podczas jazd. Potrafi wyjść z samochodu nawet na 20 minut, a kursant i tak płaci za pełną godzinę. Żadnego realnego szkolenia tam nie ma — zamiast uczyć, siedzi na fotelu pasażera i ogląda TikToki. Jako instruktor jest kompletnie beznadziejny.W praktyce kursant staje się jego prywatnym kierowcą i wozi go po jego sprawach za własne, niemałe pieniądze.Omijajcie tę szkołę szerokim łukiem. Jedyny pozytywny aspekt tego miejsca to pani z biura — naprawdę profesjonalna i kompetentna osoba. Bardzo jej życzę znalezienia lepszej pracy niż współpraca z tak agresywnym i niekulturalnym człowiekiem.
