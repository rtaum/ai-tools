              - generic [ref=f18e3334]: I passed the first time.I think I was taught really well. Which doesn't mean I don't have any complaints. I recommend reading the whole thing.The driving lessons quickly became unpleasant. The instructor's comments were unnecessarily sarcastic and irritating for a long time."Do we drive on the right or the left in Poland?""Do you work as a window washer? Because you make those movements when you turn the steering wheel."About 10 hours into the driving test, I confronted Mr. Dariusz directly. He told me he gave me those comments because they helped me remember things better. And seriously, at that moment, I saw how much sense it made. From that moment on, I wasn't so irritated and could enjoy the course normally. Instead of getting frustrated by the comments, I often asked for details, which the instructor explained perfectly. The key to making the most of those driving lessons was simply a positive attitude.The course would have been truly excellent if I hadn't had such a hard time with the initial driving lessons.
